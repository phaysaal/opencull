name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows is reported but not yet enforced: the application still shells
    # out to macOS-only tools in several places, so a red Windows leg is
    # expected until that work lands. Linux and macOS are enforced.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt links against the system's GL and EGL, and a bare Ubuntu runner
      # has neither -- so PySide6 imports fine from pip and then fails to
      # load, which reads as a mysterious collection error rather than a
      # missing package. Nothing here is needed to RUN offscreen; they are
      # needed for the shared library to load at all.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm the RAW decoder is present
        # A missing rawpy silently degrades every RAW preview to a per-photo
        # subprocess, which is how it went unnoticed in shipped builds.
        run: |
          python -c "import scan; s = scan.raw_decoder_status(); print(s); raise SystemExit(0 if s['decoder'] == 'rawpy' else 1)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
